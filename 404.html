<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Ellie Carpenter</title>
<meta name="robots" content="noindex">
<!-- Self-contained on purpose: GitHub serves this file for any missing path,
     at any depth, so it cannot rely on a relative stylesheet resolving. -->
<style>
  :root {
    --paper: #f4f1ea;
    --ink: #14110f;
    --ink-soft: #45403a;
    --red: #d8323f;
    --display: "Futura", "Century Gothic", "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --type: "Courier New", Courier, ui-monospace, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: clamp(1.5rem, 6vw, 4rem);
    background: var(--paper)
      radial-gradient(circle at 20% 15%, rgba(216, 50, 63, .06), transparent 45%);
    color: var(--ink);
    font-family: var(--body);
    line-height: 1.65;
    text-align: center;
  }
  .code {
    font-family: var(--type);
    font-size: clamp(2rem, 1.4rem + 3vw, 3.25rem);
    letter-spacing: .1em;
    color: var(--red);
    margin: 0 0 1rem;
  }
  h1 {
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(2.1rem, 1.4rem + 3.2vw, 3.4rem);
    line-height: 1.05;
    letter-spacing: -.015em;
    margin: 0 0 1rem;
  }
  p {
    max-width: 46ch;
    margin: 0 auto;
    font-size: clamp(1.05rem, 1rem + .3vw, 1.2rem);
    color: var(--ink-soft);
  }
  .actions { display: flex; flex-wrap: wrap; gap: .85rem; justify-content: center; margin-top: 2.25rem; }
  a.btn {
    display: inline-flex;
    padding: .9rem 1.5rem;
    border: 1px solid var(--ink);
    border-radius: 2px;
    background: var(--ink);
    color: var(--paper);
    font-size: .9rem;
    font-weight: 500;
    text-decoration: none;
    transition: transform .2s cubic-bezier(.2,.7,.3,1), background-color .2s, color .2s;
  }
  a.btn:hover { transform: translateY(-2px); }
  a.btn.ghost { background: transparent; color: var(--ink); }
  a.btn.ghost:hover { background: var(--ink); color: var(--paper); }
  a.btn:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { a.btn { transition: none; } }
</style>
</head>
<body>

<main>
  <p class="code">404</p>
  <h1>Nothing packed in here.</h1>
  <p>That page has been moved, or never existed. The work is all still where you left it.</p>
  <div class="actions">
    <a class="btn" href="/">Back to the portfolio</a>
    <a class="btn ghost" href="/projects/grip.html">See the Grip project</a>
  </div>
</main>

</body>
</html>
